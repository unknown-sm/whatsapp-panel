version: "3.8"

services:
  whatsapp-panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-panel
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whatsapp.rule=Host(`crm.seiva.com.py`)"
      - "traefik.http.routers.whatsapp.entrypoints=websecure"
      - "traefik.http.routers.whatsapp.tls.certresolver=letsencrypt"
      - "traefik.http.services.whatsapp.loadbalancer.server.port=4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://whatsapp:${POSTGRES_PASSWORD}@postgres:5432/whatsapp_panel
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Definir ENCRYPTION_KEY en el entorno (32+ chars)}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL}
      WEBHOOK_BASE_URL: ${FRONTEND_URL}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:?Definir META_APP_SECRET (webhook fail-closed en produccion)}
      META_APP_ID: ${META_APP_ID:-}
      META_CONFIG_ID: ${META_CONFIG_ID:-}
      META_REDIRECT_URI: ${META_REDIRECT_URI:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - whatsapp-uploads:/app/backend/uploads
    networks:
      - dokploy-network

volumes:
  whatsapp-uploads:

networks:
  dokploy-network:
    external: true
