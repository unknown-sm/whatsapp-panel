version: "3.8"

services:
  whatsapp-panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-panel
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whatsapp.rule=Host(`crm.seiva.com.py`)"
      - "traefik.http.routers.whatsapp.entrypoints=websecure"
      - "traefik.http.routers.whatsapp.tls.certresolver=letsencrypt"
      - "traefik.http.services.whatsapp.loadbalancer.server.port=4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://whatsapp:${POSTGRES_PASSWORD}@postgres:5432/whatsapp_panel
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL}
      WEBHOOK_BASE_URL: ${FRONTEND_URL}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
