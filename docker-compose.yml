services:
  whatsapp-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en el entorno}
      POSTGRES_DB: whatsapp_panel
    volumes:
      - whatsapp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp -d whatsapp_panel"]
      interval: 5s
      timeout: 5s
      retries: 10

  whatsapp-panel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVE_FRONTEND: "true"
      PORT: "4000"
      DATABASE_URL: postgresql://whatsapp:${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en el entorno}@whatsapp-db:5432/whatsapp_panel
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en el entorno}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:?Definir FRONTEND_URL (origen del frontend)}
      WHATSAPP_ENGINE: ${WHATSAPP_ENGINE:-meta}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:-}
    depends_on:
      whatsapp-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  whatsapp-db-data:
