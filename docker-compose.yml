services:
  whatsapp-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp_secret
      POSTGRES_DB: whatsapp_panel
    volumes:
      - whatsapp-db-data:/var/lib/postgresql/data

  openwa:
    build:
      context: ./openwa
      dockerfile: Dockerfile
    image: whatsapp-panel-openwa:latest
    environment:
      NODE_ENV: production
      API_PORT: 2785
      LOG_LEVEL: warn
      CORS_ORIGINS: "*"
      DASHBOARD_ENABLED: "true"
      DASHBOARD_PORT: "2886"
      ENGINE_TYPE: whatsapp-web.js
      SESSION_DATA_PATH: /app/data/sessions
      PUPPETEER_HEADLESS: "true"
      PUPPETEER_ARGS: --no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      DATABASE_TYPE: sqlite
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      WEBHOOK_TIMEOUT: "10000"
      WEBHOOK_MAX_RETRIES: "3"
      WEBHOOK_RETRY_DELAY: "5000"
      DATABASE_SYNCHRONIZE: "true"
      ENABLE_SWAGGER: "false"
      API_MASTER_KEY: openwa-dev-master-key-2024
    volumes:
      - openwa-data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwa.rule=Host(`openwa.zwpkae.easypanel.host`)"
      - "traefik.http.routers.openwa.entrypoints=websecure"
      - "traefik.http.routers.openwa.tls.certresolver=leresolver"
      - "traefik.http.services.openwa.loadbalancer.server.port=2785"

  whatsapp-panel:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      SERVE_FRONTEND: "true"
      PORT: "4000"
      DATABASE_URL: postgresql://whatsapp:whatsapp_secret@whatsapp-db:5432/whatsapp_panel
      JWT_SECRET: ${JWT_SECRET:-whatsapp-panel-jwt-secret-2024}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: https://whatsapp-panel.zwpkae.easypanel.host
      WHATSAPP_ENGINE: openwa
      OPENWA_URL: http://openwa:2785
      OPENWA_API_KEY: owa_k1_c3bc557c051f429dccc90fb54849ae314685f1c876af4471fb1e7a56a2113e33
      OPENWA_SESSION_ID: c9cf4bd8-dbdf-4e84-8c32-4c2f8bb9a7dd
      MEDIA_STORAGE_PATH: ./uploads
      MAX_UPLOAD_SIZE_MB: "50"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whatsapp-panel.rule=Host(`whatsapp-panel.zwpkae.easypanel.host`)"
      - "traefik.http.routers.whatsapp-panel.entrypoints=websecure"
      - "traefik.http.routers.whatsapp-panel.tls.certresolver=leresolver"
      - "traefik.http.services.whatsapp-panel.loadbalancer.server.port=4000"
    depends_on:
      - whatsapp-db

volumes:
  whatsapp-db-data:
  openwa-data:
