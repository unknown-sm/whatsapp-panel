services:
  whatsapp-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp_secret
      POSTGRES_DB: whatsapp_panel
    volumes:
      - whatsapp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp -d whatsapp_panel"]
      interval: 5s
      timeout: 5s
      retries: 10

  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: openwa
    restart: unless-stopped
    environment:
      - OA_BASE_URL=http://localhost:2785
      - OA_CONFIG_PATH=/config
      - OA_HEADLESS=true
      - OA_RECONNECTION=true
      - OA_RECONNECTION_INTERVAL=5000
      - OA_RECOVERY_TOKEN=false
      - OA_QRCODE_LOG=true
      - WA_BROWSER_PATH=/usr/bin/chromium-browser
      - WA_CHROMIUM_REVISION=119
    volumes:
      - openwa-data:/config

  whatsapp-panel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVE_FRONTEND: "true"
      PORT: "80"
      DATABASE_URL: postgresql://whatsapp:whatsapp_secret@whatsapp-db:5432/whatsapp_panel
      JWT_SECRET: ${JWT_SECRET:-whatsapp-panel-jwt-secret-2024}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: https://whatsapp-cmr-crm-whatsapp.zwpkae.easypanel.host
      WHATSAPP_ENGINE: ${WHATSAPP_ENGINE:-openwa}
      WEBHOOK_BASE_URL: https://whatsapp-cmr-crm-whatsapp.zwpkae.easypanel.host
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-whatsapp-panel-verify}
      OPENWA_BASE_URL: ${OPENWA_BASE_URL:-http://openwa:2785}
      OPENWA_API_KEY: ${OPENWA_API_KEY}
    depends_on:
      whatsapp-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  whatsapp-db-data:
  openwa-data:
